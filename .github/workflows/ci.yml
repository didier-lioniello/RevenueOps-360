name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-lock.txt --strict

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Smoke-test installed wheel and console script
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv revenueops-wheel
          revenueops-wheel/bin/python -m pip install --no-deps "${GITHUB_WORKSPACE}"/dist/*.whl
          revenueops-wheel/bin/revenueops --version
          revenueops-wheel/bin/python -c "import revenueops; assert revenueops.__version__ == '0.1.0'"
          revenueops-wheel/bin/python -c "from importlib.resources import files; root = files('revenueops').joinpath('web'); assert all(root.joinpath(name).is_file() for name in ('index.html', 'styles.css', 'app.js'))"

      - name: Rebuild committed static demo
        run: python -m revenueops build-site --output-dir docs

      - name: Verify demo is current
        run: git diff --exit-code -- docs

      - name: Upload verified static demo
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revenueops-verified-deliverables
          path: |
            docs/
            dist/*.whl
          if-no-files-found: error
          retention-days: 7
